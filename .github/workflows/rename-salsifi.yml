name: Rename salsifi

on:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: rename-salsifi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Rewrite commits from zimzoum29 to salsifi
        env:
          BRANCH: ${{ github.ref_name }}
          FILTER_BRANCH_SQUELCH_WARNING: "1"
        run: |
          set -e
          before=$(git rev-parse HEAD)

          git filter-branch -f --env-filter '
          is_target() {
            case "$1" in
              timeo.gondran@hotmail.com|119447248+zimzoum29@users.noreply.github.com) return 0 ;;
            esac
            case "$2" in
              zimzoum29|zimzoum) return 0 ;;
            esac
            return 1
          }
          if is_target "$GIT_AUTHOR_EMAIL" "$GIT_AUTHOR_NAME"; then
            export GIT_AUTHOR_NAME=salsifi
            export GIT_AUTHOR_EMAIL=salsifi@salsifi.salsifi
          fi
          if is_target "$GIT_COMMITTER_EMAIL" "$GIT_COMMITTER_NAME"; then
            export GIT_COMMITTER_NAME=salsifi
            export GIT_COMMITTER_EMAIL=salsifi@salsifi.salsifi
          fi
          ' -- HEAD

          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Aucun commit à renommer."
            exit 0
          fi

          echo "Commits réécrits, push forcé sur $BRANCH."
          git push --force-with-lease="refs/heads/$BRANCH:$before" origin "HEAD:refs/heads/$BRANCH"
