[project]
name = "pacman"
version = "0.1.0"
description = "42 project named Pacman"
readme = "README.md"
authors = [
    { name = "zimzoum29", email = "timeo.gondran@hotmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "mazegenerator>=1.2.1",
    "pydantic>=2.14.1",
    "pygame-ce>=2.5.8",
]

[project.scripts]
pacman = "pacman:main"

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
